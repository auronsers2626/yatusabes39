<head>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo-banner-container">
            <img src="img/retrovibes.png" alt="Logo de LevelUp" class="logo">
        </div>
        <div class="menu-icon" onclick="toggleMenu()">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="index.html" title="Inicio">Inicio</a></li>
                <li><a href="noticias.html" title="Noticias">Noticias</a></li>
                <li><a href="reseñas.html" title="Reseñas">Reseñas</a></li>
                <li><a href="guias.html" title="Guías y Tutoriales">Guías y Tutoriales</a></li>
                <li><a href="comunidad.html" title="Comunidad">Comunidad</a></li>
                <li><a href="catalogo.html" title="catalogo">Catalogo</a></li>
                <li><a href="contacto.html" title="Contacto">Contacto</a></li> 
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Ponte en Contacto</h2>
            <p>Para cualquier consulta, duda o sugerencia, puedes escribirnos a:</p>
            <form>
                <label for="nombre">Name:</label>
                <input type="text" id="nombre" name="nombre" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="4" cols="50" required></textarea><br><br>
                <input type="submit" value="Enviar">
            </form>
        </section>
        <section id="registro">
            <div class="register">
                <h2>Regístrate</h2>
                <form>
                    <input type="text" id="usuario" name="usuario" placeholder="Nombre de Usuario" required><br>
                    <input type="email" id="correo" name="correo" placeholder="Correo Electrónico" required><br>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña" required><br>
                    <input type="submit" value="Crear Cuenta">
                </form>
  
        </section>
    </main>

    <footer>

    </footer>
</body>
